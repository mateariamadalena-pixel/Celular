<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Radar de Voos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>✈ Radar de Voos</strong>
    <input id="busca" type="search" placeholder="Buscar voo (ex: TAM3054)" autocomplete="off">
    <select id="fonte" title="Fonte dos dados">
      <option value="auto">Automático</option>
      <option value="adsblol">adsb.lol</option>
      <option value="airplaneslive">airplanes.live</option>
      <option value="adsbfi">adsb.fi</option>
      <option value="opensky">OpenSky</option>
    </select>
  </header>

  <div id="mapa"></div>

  <div class="status" id="status">Carregando…</div>
  <button class="fab" id="btnLocal" title="Minha localização">◎</button>

  <section class="acima" id="acima">
    <header>
      <span>Acima de você</span>
      <button id="btnBussola" title="Usar a bússola do celular">🧭</button>
      <button id="btnAlertas" title="Alertas">🔔</button>
    </header>
    <div id="acimaConteudo" class="vazio">Ative a localização para ver o avião que está passando sobre você.</div>
  </section>

  <div class="toast oculto" id="toast"></div>

  <dialog id="dlgAlertas">
    <form method="dialog">
      <h3>Alertas</h3>
      <label><input type="checkbox" id="alPerto"> Avisar quando um avião passar perto de mim</label>
      <label class="recuo">Distância:
        <select id="alRaio">
          <option value="2">2 km</option>
          <option value="5">5 km</option>
          <option value="10">10 km</option>
        </select>
      </label>
      <label><input type="checkbox" id="alEmergencia"> Avisar emergências (código 7700, 7600, 7500)</label>
      <p class="nota">Os avisos funcionam enquanto o app estiver aberto ou em segundo plano recente.</p>
      <button value="ok">Salvar</button>
    </form>
  </dialog>

  <aside class="painel oculto" id="painel">
    <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    <h2 id="pCallsign">—</h2>
    <div class="rota-painel" id="pRota"></div>
    <div class="foto" id="pFoto" hidden></div>
    <dl id="pDados"></dl>
    <div id="pLista" hidden></div>
    <a id="pLink" target="_blank" rel="noopener">Ver trajeto no mapa do adsb.lol ↗</a>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
